<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נפאל - חברת טיולים ומדריכים למטייל</title>
    <style>
        /* איפוס בסיסי וניקיון מוחלט של אלמנטים */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            background-color: #121212;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* שכבת רקע קבועה שלא חוסמת שום אינטראקציה עכברית */
        .page-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        /* שכבת הצללה עדינה מעל הרקע לקריאות מושלמת של הטקסט */
        .page-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
            pointer-events: none;
        }

        /* תפריט ניווט עליון נגיש ולחיץ */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #ffcc00;
        }

        /* אזור התוכן המרכזי */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .hero-card {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px 30px;
            max-width: 750px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            border: 4px solid #ffcc00;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 38px;
            color: #ffcc00;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #f1f1f1;
            margin-bottom: 35px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .cta-button {
            display: inline-block;
            background-color: #ffcc00;
            color: #121212;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
            transition: all 0.2s ease;
        }

        .cta-button:hover {
            background-color: #ffdb4d;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.6);
        }

        /* באנר עוגיות / פרטיות תחתון */
        .privacy-banner {
            background: rgba(10, 10, 10, 0.95);
            color: #b0b0b0;
            padding: 12px 20px;
            text-align: center;
            font-size: 14px;
            border-top: 1px solid #333;
            z-index: 90;
        }

        .privacy-banner a {
            color: #ffcc00;
            text-decoration: underline;
            margin-right: 8px;
        }

        /* רספונסיביות למובייל */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            nav {
                gap: 15px;
            }
            h1 {
                font-size: 28px;
            }
            .hero-card {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- תמונת רקע מדויקת ברמת ה-DOM -->
    <img src="image_77afbe.jpg" alt="רקע שולחן" class="page-background">
    <div class="page-overlay"></div>

    <!-- תפריט עליון -->
    <header>
        <a href="#" class="logo">Nepal.co.il</a>
        <nav>
            <a href="#">דף הבית</a>
            <a href="#">טרקים ומסלולים</a>
            <a href="#">אודותינו</a>
            <a href="#">צור קשר</a>
        </nav>
    </header>

    <!-- תוכן עיקרי של האתר -->
    main>
        <div class="hero-card">
            <img src="girl.jpg" alt="ילדה בנפאל" class="profile-img">
            <h1>המסע הבא שלך לגג העולם</h1>
            <p>ברוכים הבאים לבית של המטיילים הישראלים בנפאל. אנחנו מציעים חוויות טיול אותנטיות, מסלולי טרקים מובילים באנאפורנה ובאוורסט, והדרכה מקצועית לכל אורך הדרך.</p>
